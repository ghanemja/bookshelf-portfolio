<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Janelle Ghanem — a tiny planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2d2138;
    --ink-dim: #7a6f8a;
    --panel: #fffaf2;
    --panel-edge: #e8d9ea;
    --accent: #ff8a5c;
    --accent-2: #8f7ae8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #d9c4f2; color: var(--ink);
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ── loader ── */
  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #a8c8f0 0%, #d9c4f2 55%, #ffd9b8 100%);
    transition: opacity 0.7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .planet-dot {
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #b6e3b0, #7fbf8b 60%, #5f9e77);
    box-shadow: 0 10px 40px rgba(90, 70, 140, 0.35);
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  #loader .bar { width: 220px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.5); overflow: hidden; }
  #loader .bar i { display: block; height: 100%; width: 0%; border-radius: 999px;
    background: var(--accent); transition: width 0.3s ease; }
  #loader p { color: #5d5375; font-weight: 600; font-size: 14px; letter-spacing: 0.04em; }

  /* ── HUD ── */
  #hud { position: fixed; top: 20px; left: 24px; z-index: 10; pointer-events: none; }
  #hud h1 { font-size: 20px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
  #hud p { font-size: 12.5px; color: #5d5375; margin-top: 3px; font-weight: 600; }

  #controls-hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    padding: 8px 16px; border-radius: 999px; pointer-events: none;
    background: rgba(255, 250, 242, 0.75); backdrop-filter: blur(8px);
    border: 2px solid var(--panel-edge);
    color: #5d5375; font-size: 12.5px; font-weight: 600; white-space: nowrap;
    transition: opacity 0.5s ease;
  }
  #controls-hint kbd { background: var(--panel-edge); color: var(--ink); padding: 1px 7px;
    border-radius: 999px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  #controls-hint.hide { opacity: 0; }

  /* ── project card ── */
  #card {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 24px); z-index: 20;
    width: min(400px, calc(100vw - 36px));
    background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 20px;
    padding: 20px 22px 18px;
    box-shadow: 0 18px 50px rgba(70, 50, 110, 0.28);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #card.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #card .c-tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent-2); background: #f0eafc;
    padding: 3px 10px; border-radius: 999px; }
  #card h2 { font-size: 24px; font-weight: 700; margin-top: 8px; }
  #card p { font-size: 14px; line-height: 1.55; color: var(--ink-dim); margin-top: 6px; }
  #card .c-actions { display: flex; gap: 10px; margin-top: 14px; }
  #card a {
    flex: 1; text-align: center; padding: 11px 12px; border-radius: 12px;
    text-decoration: none; font-weight: 700; font-size: 14px;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  #card a:hover { transform: translateY(-1px); filter: brightness(1.06); }
  #card a.primary { background: var(--accent); color: #fff6ec; box-shadow: 0 3px 0 #d96a40; }
  #card a.secondary { background: #efe7f7; color: var(--ink); box-shadow: 0 3px 0 #d5c5e2; }
  #card .c-close { position: absolute; top: 10px; right: 14px; border: none; background: none;
    font-size: 20px; color: var(--ink-dim); cursor: pointer; }

  /* ── mobile joystick ── */
  #stick {
    position: fixed; z-index: 15; width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255, 250, 242, 0.35); border: 2px solid rgba(255,255,255,0.55);
    backdrop-filter: blur(4px); display: none;
  }
  #stick .knob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255, 250, 242, 0.9); border: 2px solid var(--panel-edge);
    transform: translate(-50%, -50%);
  }
  body.touch #stick { display: block; left: 24px; bottom: 24px; }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="planet-dot"></div>
    <div class="bar"><i id="loader-bar"></i></div>
    <p id="loader-msg">warming up the planet…</p>
  </div>

  <div id="hud">
    <h1>janelle's tiny planet</h1>
    <p>every building is a project — fly over and take a look</p>
  </div>

  <div id="controls-hint">
    <kbd>WASD</kbd> / <kbd>←↑↓→</kbd> fly &nbsp;·&nbsp; click ground to travel &nbsp;·&nbsp; click a building
  </div>

  <div id="card" aria-hidden="true">
    <button class="c-close" aria-label="close">×</button>
    <span class="c-tag" id="card-tag">project</span>
    <h2 id="card-title">—</h2>
    <p id="card-desc">—</p>
    <div class="c-actions">
      <a id="card-visit" class="primary" target="_blank" rel="noopener">visit live →</a>
      <a id="card-enter" class="secondary">step inside →</a>
    </div>
  </div>

  <div id="stick"><div class="knob" id="stick-knob"></div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./planet.js?cb=p1"></script>
</body>
</html>
