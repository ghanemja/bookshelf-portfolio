<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Vanishing Gallery — an art heist on Janelle's tiny planet</title>
<link rel="preload" href="./fonts/caveat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/patrick-hand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* hand-lettering, bundled with the game (OFL fonts: Caveat, Patrick Hand) */
  @font-face { font-family: 'Caveat'; font-weight: 700; font-display: swap; src: url(./fonts/caveat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Caveat'; font-weight: 600; font-display: swap; src: url(./fonts/caveat-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Patrick Hand'; font-weight: 400; font-display: swap; src: url(./fonts/patrick-hand-latin-400-normal.woff2) format('woff2'); }
  :root {
    --paper: #f6efdf; --paper2: #efe4cc; --ink: #2a2230; --ink2: #5a4e5e; --accent: #e8604c; --gold: #e4b84f;
    --sketch: 255px 14px 225px 16px / 16px 225px 14px 255px;   /* a hand-drawn box */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ead7; font-family: 'Patrick Hand', 'Comic Sans MS', cursive; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  body.touch { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }   /* no double-tap zoom / text selection on phones */
  .ui { position: fixed; z-index: 10; }
  .sk { background: var(--paper); border: 2.5px solid var(--ink); border-radius: var(--sketch); box-shadow: 3px 4px 0 rgba(42,34,48,0.85); }
  button.sk { font: inherit; font-size: 20px; color: var(--ink); padding: 8px 22px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  button.sk:hover { transform: translate(-1px,-1px) rotate(-0.6deg); box-shadow: 5px 6px 0 rgba(42,34,48,0.85); }
  button.sk:active { transform: translate(2px,3px); box-shadow: 1px 1px 0 rgba(42,34,48,0.85); }
  .hide { opacity: 0 !important; pointer-events: none !important; }
  .fade { transition: opacity .6s ease; }

  /* title page */
  #title { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7vh; gap: 4px; text-align: center; pointer-events: none; }
  #title p, #title .by { background: rgba(246,239,223,.82); border-radius: var(--sketch); padding: 2px 14px; }
  #title h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(54px, 11vw, 132px); line-height: .9; margin: 0;
    color: var(--ink); text-shadow: 3px 3px 0 var(--paper); transform: rotate(-2deg); }
  #title h1 span { color: var(--accent); }
  #title p { font-size: clamp(18px, 2.6vw, 26px); margin: 6px 16px; color: var(--ink2); }
  #title .by { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  #title button { pointer-events: auto; margin-top: auto; margin-bottom: max(16vh, 70px); font-size: 26px; padding: 10px 34px; background: var(--gold); transform: rotate(-1.5deg); }

  /* cold open */
  .bar { left: 0; right: 0; height: 11vh; background: #17121b; transition: transform .8s ease; z-index: 30; }
  #barT { top: 0; transform: translateY(-100%); } #barB { bottom: 0; transform: translateY(100%); }
  body.cine #barT, body.cine #barB { transform: none; }
  #caption { left: 50%; bottom: 14vh; transform: translateX(-50%); font-family: 'Caveat', cursive; font-size: clamp(26px, 4vw, 40px); color: #f6efdf; z-index: 31; text-shadow: 0 2px 0 #17121b; white-space: nowrap; }
  #skip { right: 18px; bottom: calc(11vh + 14px); z-index: 31; font-size: 16px; padding: 4px 14px; }

  /* hud */
  #hud { left: 14px; top: 12px; width: min(330px, 46vw); padding: 8px 14px 6px; transform: rotate(-0.4deg); }
  #hud b { font-family: 'Caveat', cursive; font-size: 28px; display: block; line-height: 1; padding-right: 30px; }
  #hud b span { font-size: 0.78em; opacity: 0.7; white-space: nowrap; }
  /* the case board folds down to its title + the current step (a little tab on its corner) */
  #caseTog { position: absolute; right: 7px; top: 7px; width: 26px; height: 24px; border: 2px solid var(--ink); border-radius: 8px;
    background: var(--gold); font: 700 18px/1 'Patrick Hand', cursive; color: var(--ink); cursor: pointer; padding: 0; box-shadow: 1px 2px 0 rgba(42,34,48,.6); }
  #caseTog:hover { background: #f0c95e; }
  #caseMini { display: none; font-size: 16px; color: var(--ink2); margin-top: 2px; }
  #hud.min #case { display: none; } #hud.min #caseMini { display: block; } #hud.min { width: auto; max-width: min(330px, 46vw); padding-right: 40px; }
  #case .st { font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; margin: 6px 0 1px; }
  #case .st.go { color: var(--accent); }
  #case .cr { font-size: 16px; line-height: 1.25; padding: 2px 6px; margin: 0 -6px; border-radius: 8px; cursor: pointer; }
  #case .cr:hover { background: rgba(228,184,79,.25); }
  #case .cr.on { background: rgba(232,96,76,.16); font-weight: 600; }
  #case .cr.done { opacity: .55; text-decoration: line-through; text-decoration-thickness: 1.5px; }
  #case .cr i { font-style: normal; display: inline-block; width: 14px; color: var(--accent); font-weight: 700; }
  #case .ct { float: right; color: var(--ink2); }
  #case p { font-size: 15px; line-height: 1.25; margin: 4px 0; color: var(--ink2); }
  #case p.soft { font-size: 13px; opacity: .8; }
  #case kbd, #hint kbd { font-family: inherit; font-size: .9em; border: 1.5px solid var(--ink); border-radius: 5px; padding: 0 5px; background: var(--gold); color: var(--ink); }
  #way { left: 0; top: 0; z-index: 9; pointer-events: none; transition: opacity .3s ease; will-change: transform; }
  #way svg { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); filter: drop-shadow(2px 3px 0 rgba(42,34,48,.5)); animation: wayBob 1.1s ease-in-out infinite; }
  #way span { position: absolute; left: 0; top: 26px; transform: translateX(-50%); white-space: nowrap; font-size: 17px; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--sketch); padding: 0 8px; }
  @keyframes wayBob { 50% { margin-top: -5px; } }
  /* someone the car just met */
  #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
  .bub { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 0 14px 2px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; will-change: transform; }
  .bub.yell { font-size: 34px; color: var(--accent); }
  .bub.wail { font-size: 42px; letter-spacing: .02em; }
  .bub.grumble { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 19px; padding: 2px 12px; }
  #nbBtn { right: 16px; top: 14px; font-size: 20px; }
  #nbBtn i { font-style: normal; display: inline-block; min-width: 22px; margin-left: 6px; background: var(--accent); color: #fff; border-radius: 50%; text-align: center; font-size: 15px; }
  #hint { left: 14px; bottom: 14px; font-size: 15px; padding: 4px 12px; max-width: calc(100vw - 200px); line-height: 1.6; opacity: .92; }
  #prompt { left: 50%; bottom: 74px; transform: translateX(-50%) rotate(-1deg); font-size: 22px; padding: 6px 18px; background: #fffaf0; }
  #prompt kbd { font-family: inherit; border: 2px solid var(--ink); border-radius: 6px; padding: 0 7px; margin-right: 6px; background: var(--gold); }

  /* a found thing: a sketchbook card */
  #card { left: 50%; top: 50%; width: min(440px, 88vw); transform: translate(-50%, -50%) rotate(-1.2deg); padding: 20px 24px 18px; z-index: 20; }
  img.pt { width: 76px; height: 76px; display: block; }
  img.pt.sm { width: 40px; height: 40px; } img.pt.xs { width: 28px; height: 28px; display: inline-block; vertical-align: middle; margin: -4px 2px -4px -6px; }
  #card .ic { float: left; margin: 0 14px 4px -4px; } #card .ic img.pt { width: 96px; height: 96px; }
  #card h3 { font-family: 'Caveat', cursive; font-size: 34px; margin: 0 0 6px; }
  #card p { font-size: 20px; line-height: 1.35; margin: 0 0 12px; }
  #card .note { font-size: 15px; color: var(--ink2); }
  #card button { float: right; }

  /* someone talks */
  #talk { left: 50%; bottom: 22px; width: min(640px, 92vw); transform: translateX(-50%); padding: 14px 20px; z-index: 20; display: flex; gap: 14px; align-items: flex-start; }
  #talk .face { flex: 0 0 auto; margin: -6px 0 -6px -6px; }
  #talk b { font-family: 'Caveat', cursive; font-size: 28px; display: block; line-height: 1; margin-bottom: 4px; }
  #talk p { font-size: 20px; margin: 0 0 8px; line-height: 1.32; }
  #talk .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  /* the notebook: lined paper */
  #nb { left: 50%; top: 50%; width: min(620px, 94vw); max-height: 82vh; max-height: 82dvh; overflow: auto; transform: translate(-50%, -50%) rotate(0.6deg); padding: 18px 26px 22px; z-index: 25;
    background-image: repeating-linear-gradient(transparent 0 31px, rgba(120,140,170,.35) 31px 32px); background-color: var(--paper); }
  #nb h2 { font-family: 'Caveat', cursive; font-size: 40px; margin: 0 0 6px; }
  #nb .x { float: right; font-size: 18px; padding: 2px 12px; }
  #nb ul { list-style: none; padding: 0; margin: 4px 0 14px; }
  #nb li { font-size: 19px; line-height: 1.4; margin: 6px 0; display: flex; gap: 10px; }
  #nb li .i { flex: 0 0 auto; }
  #nb li.pick { cursor: pointer; border-radius: 8px; padding: 2px 6px; }
  #nb li.pick.on { background: rgba(228,184,79,.45); }
  #nb .empty { color: var(--ink2); font-style: italic; }
  #nb .who { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 12px; }
  #nb .who button.on { background: var(--gold); }
  #nb .verdict { font-size: 20px; padding: 10px 14px; margin-top: 10px; }

  /* the phone: a sketched handset */
  #phone { right: 22px; bottom: 22px; width: min(320px, 86vw); padding: 14px 16px 16px; z-index: 22; transform: rotate(1.4deg); }
  #phone .hd { font-size: 16px; color: var(--ink2); border-bottom: 2px dashed rgba(42,34,48,.3); padding-bottom: 6px; margin-bottom: 8px; }
  #phone .msg { background: #fffaf0; border: 2px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 6px 10px; margin: 6px 0; font-size: 18px; line-height: 1.3; }
  #phone button { margin-top: 8px; width: 100%; }

  #loader { inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Caveat', cursive; font-size: 34px; background: #f3ead7; z-index: 50; }
  /* the backpack button + panel */
  /* the driving map: heading-up, bottom-right (clear of the message pop-ups up top) */
  #minimapBox { right: 16px; bottom: 64px; width: 176px; padding: 8px 8px 6px; text-align: center; transform: rotate(0.8deg); border-radius: 18px; transition: opacity .3s; }
  #minimapBox.hide { opacity: 0; pointer-events: none; }
  #minimap { width: 160px; height: 160px; display: block; margin: 0 auto; }
  #minimapLab { font-size: 15px; line-height: 1.2; margin-top: 4px; color: var(--ink); }
  #minimapLab b { font-family: 'Caveat', cursive; font-size: 20px; }
  body.cine #minimapBox { opacity: 0 !important; }
  #bagBtn { right: 160px; top: 14px; padding: 2px 10px 0; line-height: 0; }
  #sndBtn { right: 228px; top: 14px; padding: 4px 10px 0; line-height: 0; z-index: 40; }
  #sndBtn .x { display: none; } #sndBtn.off .x { display: inline; } #sndBtn.off .w { display: none; }
  #bagBtn i, .it i, .app i { position: absolute; top: -8px; right: -8px; font-style: normal; min-width: 22px; line-height: 22px; background: var(--accent); color: #fff; border-radius: 50%; text-align: center; font-size: 14px; border: 2px solid var(--ink); }
  #bag { left: 50%; top: 50%; width: min(560px, 94vw); transform: translate(-50%, -50%) rotate(-0.8deg); padding: 16px 22px 20px; z-index: 24; background: #f3e1b4; }
  #bag h2 { font-family: 'Caveat', cursive; font-size: 40px; margin: 0 0 8px; }
  #bag .x { float: right; font-size: 18px; padding: 2px 12px; }
  #bag .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  #bag .it { position: relative; font: inherit; text-align: left; background: var(--paper); border: 2.5px solid var(--ink); border-radius: var(--sketch); padding: 8px 10px; cursor: pointer; box-shadow: 2px 3px 0 rgba(42,34,48,.8); }
  #bag .it:hover { transform: rotate(-1deg) translateY(-2px); }
  #bag .it svg { width: 44px; height: 44px; display: block; }
  #bag .it b { display: block; font-size: 19px; } #bag .it small { display: block; font-size: 14px; color: var(--ink2); line-height: 1.2; }
  /* the handset */
  #handset { right: 26px; bottom: 26px; width: min(300px, 80vw); height: min(560px, 78vh); background: #2a2230; border-radius: 34px; padding: 34px 12px 40px; z-index: 23;
    box-shadow: 4px 6px 0 rgba(42,34,48,.6); transform: rotate(1.5deg); display: flex; flex-direction: column; }
  #handset .ear { position: absolute; top: 14px; left: 50%; width: 54px; height: 6px; margin-left: -27px; border-radius: 3px; background: #4a3f52; }
  #handset .homebtn { position: absolute; bottom: 10px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; border: 2px solid #4a3f52; background: none; padding: 0; cursor: pointer; }
  #handset .homebtn:hover { border-color: #8a7f92; }
  #phClose { position: absolute; top: -44px; right: 4px; font-size: 17px; padding: 3px 12px; transform: rotate(-1.5deg); }
  #screen { flex: 1; background: var(--paper); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  #screen .sbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 15px; border-bottom: 2px dashed rgba(42,34,48,.25); }
  #screen .sbar b { font-size: 17px; } #screen .back { font: inherit; font-size: 24px; line-height: 1; border: none; background: none; cursor: pointer; color: var(--ink); padding: 0 6px; }
  #screen .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; padding: 18px 12px; }
  #screen .app { position: relative; font: inherit; font-size: 14px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); }
  #screen .app svg { width: 52px; height: 52px; filter: drop-shadow(1px 2px 0 rgba(42,34,48,.5)); }
  #screen .app:hover svg { transform: rotate(-4deg) scale(1.06); }
  #screen .hint { margin-top: auto; text-align: center; font-size: 13px; color: var(--ink2); padding: 8px; }
  #screen .msgs { overflow: auto; padding: 8px 10px; flex: 1; }
  #screen .m { background: #fffaf0; border: 2px solid var(--ink); border-radius: 14px 14px 14px 4px; padding: 4px 9px 2px; margin: 7px 0; max-width: 92%; }
  #screen .m.mum { background: #f6d6dc; margin-left: auto; border-radius: 14px 14px 4px 14px; }
  #screen .m.me { background: #cfe6d8; margin-left: auto; border-radius: 14px 14px 4px 14px; }
  #screen .typing { display: flex; gap: 4px; padding: 6px 12px 10px; } #screen .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink2); animation: tdot 1s infinite; }
  #screen .typing span:nth-child(2) { animation-delay: .15s; } #screen .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes tdot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  #screen .reply { margin: 6px 12px 12px auto; font-size: 18px; padding: 4px 18px; background: var(--gold); animation: tpop .35s ease; }
  @keyframes tpop { from { transform: scale(.8); opacity: 0; } }
  /* the chat: bubbles with tails, a composer, suggested replies, a keypad */
  #screen .sbar.chat { padding: 4px 8px; } #screen .contact { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  #screen .contact .av { width: 26px; height: 26px; border-radius: 50%; background: #93abc0; color: #fff; display: grid; place-items: center; font-size: 15px; border: 2px solid var(--ink); }
  #screen .contact b { font-size: 13px; margin-top: 2px; }
  #screen .msgs.chat { padding: 6px 10px 4px; display: flex; flex-direction: column; }
  #screen .who { font-size: 12px; color: var(--ink2); margin: 6px 0 1px 10px; }
  #screen .b { position: relative; max-width: 78%; padding: 6px 11px; margin: 2px 0; font-size: 15px; line-height: 1.25; border-radius: 17px; border: 2px solid var(--ink); animation: tpop .25s ease; }
  #screen .b.them { align-self: flex-start; background: #fffaf0; }
  #screen .b.me { align-self: flex-end; background: #7fb3a8; color: #10221e; }
  #screen .b.mum { background: #f6d6dc; }
  #screen .b.them.tail { border-bottom-left-radius: 4px; } #screen .b.me.tail { border-bottom-right-radius: 4px; }
  #screen .b.them.tail::after { content: ''; position: absolute; left: -7px; bottom: -2px; width: 10px; height: 10px; background: inherit; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); border-bottom-left-radius: 10px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transform: skewX(20deg); }
  #screen .b.me.tail::after { content: ''; position: absolute; right: -7px; bottom: -2px; width: 10px; height: 10px; background: inherit; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); border-bottom-right-radius: 10px; transform: skewX(-20deg); }
  #screen .t { font-size: 10px; color: var(--ink2); margin: 1px 6px 4px; } #screen .t.me { align-self: flex-end; }
  #screen .b.typing { display: flex; gap: 4px; padding: 9px 12px; }
  #screen .b.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink2); animation: tdot 1s infinite; }
  #screen .b.typing span:nth-child(2) { animation-delay: .15s; } #screen .b.typing span:nth-child(3) { animation-delay: .3s; }
  #screen .sugg { display: flex; gap: 6px; padding: 6px 8px 2px; overflow-x: auto; }
  #screen .chip { font: inherit; font-size: 14px; white-space: nowrap; padding: 4px 11px; border-radius: 16px; border: 2px solid var(--ink); background: #fff3c9; cursor: pointer; color: var(--ink); animation: tpop .3s ease; }
  #screen .chip:hover { background: var(--gold); transform: translateY(-1px); }
  #screen .composer { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-top: 2px dashed rgba(42,34,48,.2); }
  #screen .field { flex: 1; border: 2px solid rgba(42,34,48,.45); border-radius: 16px; padding: 3px 10px; font-size: 14px; color: rgba(42,34,48,.4); min-height: 20px; }
  #screen .field.on { color: var(--ink); border-color: var(--ink); }
  #screen .send { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); background: #7fb3a8; font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
  #screen .kb { background: #d9cfba; padding: 5px 3px 7px; display: flex; flex-direction: column; gap: 5px; }
  #screen .kb .row { display: flex; justify-content: center; gap: 3px; }
  #screen .kb .k { flex: 0 0 8.4%; text-align: center; background: #fffaf0; border-radius: 5px; box-shadow: 0 2px 0 rgba(42,34,48,.45); font-size: 13px; padding: 5px 0 4px; transition: background .08s, transform .08s; }
  #screen .kb .k.wide { flex-basis: 13%; font-size: 10px; background: #bfb39b; } #screen .kb .k.space { flex: 0 0 48%; font-size: 11px; color: var(--ink2); }
  #screen .kb .k.hit { background: var(--gold); transform: translateY(1px) scale(1.12); box-shadow: none; }
  #screen .m b { font-size: 13px; color: var(--ink2); } #screen .m p { margin: 0; font-size: 16px; line-height: 1.25; } #screen .m small { font-size: 11px; color: var(--ink2); }
  #screen canvas { width: 100%; flex: 1; min-height: 0; object-fit: contain; cursor: pointer; }
  #screen .legend { font-size: 13px; text-align: center; color: var(--ink2); padding: 4px; }
  #screen .vf { flex: 1; margin: 10px; border: 2px dashed var(--ink); border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; position: relative; background: rgba(159,208,216,.15); }
  #screen .vf p { font-size: 14px; color: var(--ink2); } #screen .cross { position: absolute; left: 50%; top: 45%; width: 30px; height: 30px; margin: -15px; border: 2px solid var(--ink); border-radius: 50%; }
  #screen .shutter { align-self: center; width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; margin: 4px 0 12px; cursor: pointer; box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 8px var(--ink); }
  #screen .shutter:active { transform: scale(.92); }
  #screen .pics { overflow: auto; padding: 10px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  #screen figure { margin: 0; background: #fff; padding: 6px 6px 2px; border: 1.5px solid var(--ink); box-shadow: 2px 3px 0 rgba(42,34,48,.5); }
  #screen figure:nth-child(odd) { transform: rotate(-1.5deg); } #screen figure:nth-child(even) { transform: rotate(1.2deg); }
  #screen figure img { width: 100%; display: block; } #screen figcaption { font-family: 'Caveat', cursive; font-size: 18px; text-align: center; }
  #screen .empty { color: var(--ink2); font-style: italic; text-align: center; padding: 20px; }
  /* a text arriving; the camera flash */
  #toast { right: 22px; top: 70px; max-width: min(320px, 80vw); padding: 8px 12px; z-index: 22; font-size: 16px; line-height: 1.25; cursor: pointer; transform: rotate(0.8deg); background: #fffaf0; }
  #toast b { display: block; font-size: 14px; color: var(--accent); } #toast small { display: block; font-size: 12px; color: var(--ink2); }
  #flash { inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  #flash.go { animation: flash .45s ease-out; } @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
