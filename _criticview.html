<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#b9a3d6}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(500,700);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0xb9a3d6);
const cam=new THREE.PerspectiveCamera(35,500/700,0.01,100);cam.position.set(2.2,1.0,2.6);cam.lookAt(0,0.7,0);
sc.add(new THREE.HemisphereLight(0xffffff,0x554466,1.4));
const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(3,5,2);sc.add(d);
// ground grid at y=0 to check feet contact
const grid=new THREE.GridHelper(4,16,0x333333,0x777777);sc.add(grid);
const CRITIC_S=0.136;let mixer;
new GLTFLoader().load('./models/critic.glb',(glb)=>{
  const rig=glb.scene;rig.scale.setScalar(CRITIC_S);rig.position.y=4.593*CRITIC_S;rig.rotation.y=-Math.PI/2;
  sc.add(rig);
  mixer=new THREE.AnimationMixer(rig);
  const clip=THREE.AnimationClip.findByName(glb.animations,'Walk')||glb.animations[0];
  mixer.clipAction(clip).play();
  window.__ready=true;window.__h=new THREE.Box3().setFromObject(rig).getSize(new THREE.Vector3()).y;
},undefined,e=>{window.__err=String(e);});
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(mixer)mixer.update(dt);r.render(sc,cam);}
loop();
window.__seek=(t)=>{if(mixer){mixer.setTime(t);r.render(sc,cam);}};
</script>
</body></html>
