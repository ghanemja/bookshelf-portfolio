<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#b9a3d6}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { AnimationUtils } from 'three';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(500,700);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0xb9a3d6);
const cam=new THREE.PerspectiveCamera(35,500/700,0.01,100);cam.position.set(2.4,1.0,2.6);cam.lookAt(0,0.7,0);
sc.add(new THREE.HemisphereLight(0xffffff,0x554466,1.4));
const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(3,5,2);sc.add(d);
sc.add(new THREE.GridHelper(4,16,0x333333,0x777777));
const S=0.136;let mixer,clips={},cur;
const RANGES={Walk:[0,23],RideBike:[24,47],Sail:[48,71],SitDrive:[72,83],RideTrain:[84,107],MountBike:[108,119],DismountBike:[120,131],BoardBoat:[132,143],LeaveBoat:[144,155]};
new GLTFLoader().load('./models/critic.glb',(glb)=>{
  const rig=glb.scene;rig.scale.setScalar(S);rig.position.y=4.593*S;rig.rotation.y=-Math.PI/2;sc.add(rig);
  mixer=new THREE.AnimationMixer(rig);
  const base=glb.animations[0];
  for(const [n,[a,b]] of Object.entries(RANGES)) clips[n]=AnimationUtils.subclip(base.clone(),n,a,b,24);
  window.__ready=true; window.__clips=Object.keys(clips);
  window.__play('RideBike');
},undefined,e=>{window.__err=String(e);});
window.__play=(name)=>{ if(!mixer||!clips[name])return; if(cur)cur.stop(); cur=mixer.clipAction(clips[name]); cur.reset().play(); };
window.__seekNorm=(f)=>{ if(cur){cur.time=f*cur.getClip().duration; mixer.update(0); r.render(sc,cam);} };
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(mixer)mixer.update(dt);r.render(sc,cam);}
loop();
</script>
</body></html>
